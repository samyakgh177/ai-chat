<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 44" fill="none">
  <defs>
    <linearGradient id="nexus-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="nexus-text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <style>
      .brand-nexus { fill: url(#nexus-text-grad); font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 21px; font-weight: 800; letter-spacing: -0.03em; }
      .brand-chat { fill: #F8FAFC; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 21px; font-weight: 600; letter-spacing: -0.02em; }
      @media (prefers-color-scheme: light) {
        .brand-chat { fill: #1E293B; }
      }
    </style>
  </defs>

  <!-- Nexus App Icon Squircle -->
  <rect x="4" y="4" width="36" height="36" rx="10" fill="url(#nexus-glow)" />

  <!-- Stylized Nexus 'N' with node connections -->
  <path
    d="M16 29V15L28 29V15"
    stroke="#FFFFFF"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="16" cy="15" r="2" fill="#FFFFFF" />
  <circle cx="28" cy="29" r="2" fill="#38BDF8" />
  <circle cx="22" cy="22" r="1.5" fill="#FFFFFF" />

  <!-- Nexus Brand Typography -->
  <text x="48" y="28" class="brand-nexus">Nexus</text>
  <text x="114" y="28" class="brand-chat">Chat</text>
</svg>
